# ==============================================================================
# JRV CRM - High Performance Production NGINX Load Balancer Configuration
# Architecture: Layer 7 Reverse Proxy with Least-Connections Load Balancing
# ==============================================================================

# Upstream cluster of horizontally scaled application nodes
upstream jrv_crm_cluster {
    # least_conn distributes requests to the node with the fewest active connections,
    # preventing any single instance from being overloaded during intensive tasks.
    least_conn;

    # Application Node Pool (expandable across containers or physical VPS nodes)
    server app-node-1:8000 max_fails=3 fail_timeout=10s;
    server app-node-2:8000 max_fails=3 fail_timeout=10s;
    server app-node-3:8000 max_fails=3 fail_timeout=10s;

    # Keepalive connections to upstream servers reduce latency per request
    keepalive 32;
}

# Optional cache zone for static assets
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost *.localhost *.jrvcrm.com;

    # Maximum file upload size (supporting large research papers, manuscripts, and attachments)
    client_max_body_size 64M;

    # Gzip Compression for maximum delivery speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers at the Edge
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # Health Check Probes (Used by AWS ALB, Docker Healthchecks, Kubernetes, or Uptime Kuma)
    # --------------------------------------------------------------------------
    location /up {
        proxy_pass http://jrv_crm_cluster/up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location /api/health {
        proxy_pass http://jrv_crm_cluster/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite build artifacts, images, fonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        proxy_pass http://jrv_crm_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 24h;
        proxy_cache_valid 404 1m;
        add_header X-Proxy-Cache $upstream_cache_status;
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Main Application Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://jrv_crm_cluster;
        proxy_http_version 1.1;

        # Critical Headers for Multi-Tenant Subdomains and TLS Termination
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Support (Vite HMR, Laravel Reverb, Livewire, Echo)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Timeouts for heavy CRM reporting and journal exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
